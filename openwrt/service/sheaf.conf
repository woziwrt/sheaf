# /etc/sheaf/sheaf.conf - settings of the sheaf service (shell variables)
SRV=203.0.113.10   # server (your server: set this)
FRAME=1328           # proxy frame size: 1328 under IPsec (ESP-in-UDP within 1500), 1400 without
# Identity on the server (one server instance per box; defaults = box 1): IKE ids <ID1|ID2>.<BOX>.sheaf,
# server ports of the two links, tunnel address of the box and of the server.
#BOX=box1; ID1=o2; ID2=vf; PORT1=47001; PORT2=47002; TUN=10.66.0.2/30; TUNGW=10.66.0.1
#BOX=sheaf-2; ID1=m1; ID2=m2; PORT1=47011; PORT2=47012; TUN=10.66.0.6/30; TUNGW=10.66.0.5     # box 2
#LAN_IF=br-lan      # the LAN's interface: routed only into shf0 (rules 900/901, table 102 with a blackhole)
#NAME1=O2; NAME2=Vodafone   # names of the two links on the status page (box 2: NAME1=T-Mobile_1 ...; "_" = space)
# Role (sheaf-run): box (default) | satellite (only modems + route the hub's links, no sheaf) | hub (no modems, links
# through satellites). Satellite of the hub below: ROLE=satellite; SAT_SRC1=10.77.0.101; SAT_SRC2=10.77.0.102
# Hub on an x86 box (example: UP Squared): ROLE=hub; HUB_IF=eth1; HUB_LINKS="10.77.0.101:7001:47021:10.77.0.11:l1 10.77.0.102:7002:47022:10.77.0.11:l2
#   10.77.0.103:7003:47023:10.77.0.12:l3 10.77.0.104:7004:47024:10.77.0.12:l4"; HUB_NAMES="O2 Vodafone T-Mobile_1 T-Mobile_2"
# Hub on a BPI-R4: one port per satellite, each its own network (/etc/config/network: lan1 = 10.77.1.1/24, lan2 =
# 10.77.2.1/24, out of br-lan; lan3 = the computer, wan free), the port of each link is found from the route to its satellite:
# Every possible satellite is listed once: the hub uses only the ones that are connected and answer (sheaf-run hub_scan,
# in after 20 s, out after 30 s); the server instance keeps all 4 links (v55 pairs links by id, any count on either end).
#   ROLE=hub; HUB_LINKS="10.77.1.101:7001:47021:10.77.1.11:l1 10.77.1.102:7002:47022:10.77.1.11:l2
#   10.77.2.103:7003:47023:10.77.2.12:l3 10.77.2.104:7004:47024:10.77.2.12:l4"
#   satellite 1 (LAN 10.77.1.11/24): ROLE=satellite; SAT_SRC1=10.77.1.101; SAT_SRC2=10.77.1.102
#   satellite 2 (LAN 10.77.2.12/24): ROLE=satellite; SAT_SRC1=10.77.2.103; SAT_SRC2=10.77.2.104
# Modem type: huawei (default: ME909s in the RBM33G, AT + DHCP) | qmi (a QMI module, dialled with uqmi, raw IP) |
# mbim (an MBIM module, dialled with umbim; needs umbim + kmod-usb-net-cdc-mbim).
# One slot of another type: MODEM_wwan1=mbim (wwan0 = slot 1, wwan1 = slot 2), e.g. one module swapped for a test.
# Modems are found by USB path (default 1-2 / 1-1 = RBM33G slots). BPI-R4 Pro 8X, M.2 modules in CN18 + CN21:
#MODEM=qmi; USB1=4-1.2; USB2=4-1.4
IPSEC=1              # 1 = IKEv2 + ESP for sheaf's UDP (PSK in /etc/swanctl/conf.d/sheaf-secret.conf)
GOMAXPROCS=2         # MT7621 = 2 cores x 2 threads
APN=internet         # mobile data APN of the SIMs (O2, Vodafone CZ: internet; T-Mobile CZ: internet.t-mobile.cz)
#APN_wwan1=internet.t-mobile.cz   # a different APN for one modem (wwan0 = slot 1, wwan1 = slot 2)
# More sheaf flags. -maxq 20: the box's uplink may queue at most 20 ms (default 100). A full uplink queue delays the
# feedback of the downlink behind upload data: with a bulk upload a video stream down lost 19 % (server dropped what
# it could not send); with 20 ms 0.7 %, and the upload itself was as fast (21.3 vs 19.5 Mbit/s). See docs/USAGE.md.
# -tungro (v61): in-order TCP segments go to shf0 as one GSO write; the box's CPU per packet is the tunnel's limit,
# so this gave +22 % through the tunnel on box 1 (18-19 -> 22-23 Mbit/s). Needs sheaf v61 or newer.
# -auth=half (v62): 32-bit HalfSipHash tag instead of SipHash (tunnel +22 % on the RBM33G, ABBA 26 Nov); the server
# instance of this box MUST run the same -auth (a mismatch drops every datagram, logged "auth mismatch?")
EXTRA="-maxq 20 -tungro -auth=half"
# Transparent TCP proxy: the LAN's TCP to public addresses goes through sheaf's proxy instead of the tunnel (on box 1
# 48 instead of 17-19 Mbit/s downloading from the internet). UDP, ICMP and private destinations keep using the tunnel.
# The server instance of this box MUST run with -tallow public (v59-tproxy/v61 or newer): without it the server
# refuses every transparent open and the LAN's TCP to the internet fails. Proxied connections end when sheaf
# restarts (tunnel connections survive it). Change -> /etc/init.d/sheaf restart.
TPROXY=1             # 1 = on, 0 = all LAN traffic through the tunnel
#TPORT=5300          # sheaf's listener on the box
# With TPROXY=1: reject UDP 443 from the LAN, so browsers fall back from QUIC (HTTP/3, through the tunnel, ~20 Mbit/s)
# to TCP and with it to the proxy. Price: no HTTP/3 (0-RTT, migration), services that only offer QUIC fail, and
# Chrome keeps QUIC off on that network for a while after switching back. Box 1 runs BLOCK_QUIC=1.
BLOCK_QUIC=0         # 1 = reject UDP 443 from the LAN
# Flowtable shortcut for forwarded LAN <-> tunnel flows (tunnel downloads on the RBM33G 20.7 -> 31.7 Mbit/s,
# +53 %, means of 4 + 4 interleaved runs). Default on.
#FLOWTABLE=1
