# LTE Sheaf hub (BPI-R4 sheaf-hub, ARMv8 CE: AES-GCM): IKEv2 for its 4 links through the satellites (CGNAT -> NAT-T), ESP transport only for its sheaf
# ports 47021-47024. /etc/swanctl/conf.d/sheaf-hub.conf on the server; removable as one file.
# The PSK line is filled in on the server only (never in git): secret = <the box's PSK>.
connections {
    sheaf-hub {
        version = 2
        local_addrs = 203.0.113.10
        remote_addrs = %any
        proposals = aes256gcm16-prfsha384-ecp384
        dpd_delay = 30s
        local {
            auth = psk
            id = server.sheaf
        }
        remote {
            auth = psk
            id = *.hub.sheaf
        }
        children {
            sheaf-hub {
                mode = transport
                local_ts = dynamic[udp/47021-47024]
                remote_ts = dynamic[udp]
                esp_proposals = aes256gcm16-ecp384
                replay_window = 1024
                dpd_action = clear
            }
        }
    }
}
secrets {
    ike-sheaf-hub {
        id-1 = server.sheaf
        id-2 = l1.hub.sheaf
        id-3 = l2.hub.sheaf
        id-4 = l3.hub.sheaf
        id-5 = l4.hub.sheaf
        secret = <PSK>
    }
}
