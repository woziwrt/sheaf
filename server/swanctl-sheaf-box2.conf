# LTE Sheaf box 2 (sheaf-2): IKEv2 from its two modems (CGNAT -> NAT-T), ESP transport only for its sheaf
# ports 47011-47012. /etc/swanctl/conf.d/sheaf-box2.conf on the server; removable as one file.
# The PSK line is filled in on the server only (never in git): secret = <the box's PSK>.
connections {
    sheaf-box2 {
        version = 2
        local_addrs = 203.0.113.10
        remote_addrs = %any
        proposals = aes256-sha384-ecp384
        dpd_delay = 30s
        local {
            auth = psk
            id = server.sheaf
        }
        remote {
            auth = psk
            id = *.sheaf-2.sheaf
        }
        children {
            sheaf-box2 {
                mode = transport
                local_ts = dynamic[udp/47011-47012]
                remote_ts = dynamic[udp]
                esp_proposals = aes256-sha256-ecp384
                replay_window = 1024
                dpd_action = clear
            }
        }
    }
}
secrets {
    ike-sheaf-box2 {
        id-1 = server.sheaf
        id-2 = m1.sheaf-2.sheaf
        id-3 = m2.sheaf-2.sheaf
        secret = <PSK>
    }
}
